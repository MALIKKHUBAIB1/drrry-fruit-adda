name: CI Quality Gate
on:
  push: { branches: [main] }
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      CI: true
      # App aur e2e dono ko SAME admin password chahiye (e2e secret hi app ka
      # admin password ban jata hai, warna admin login test fail hota hai).
      ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || 'Admin@123' }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      # CI kabhi production DB par na chale — har workflow ka apna test DB.
      MONGODB_DB: dryfruitadda_ci
      E2E_ADMIN_EMAIL: admin@dryfruitadda.in
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # Placeholder keys: payment security tests ko "keys configured" state
      # chahiye (warna 503), in se koi real gateway call NAHI hoti.
      RAZORPAY_KEY_ID: rzp_test_ci_placeholder
      RAZORPAY_KEY_SECRET: ci-placeholder-not-a-secret
      NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run scan:secrets
        env:
          ADMIN_PASSWORD: ci-placeholder-not-a-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-not-a-secret
      - run: npm audit --audit-level=high --omit=dev || true
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start app
        run: |
          npx next start --port 3100 &
          npx wait-on http://localhost:3100/api/health
      - run: npm run test
      - run: npm run test:security
      - run: npx playwright test --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
