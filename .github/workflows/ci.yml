name: CI Quality Gate
on:
  push: { branches: [main] }
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run scan:secrets
        env:
          ADMIN_PASSWORD: ci-placeholder-not-a-secret
          RAZORPAY_KEY_SECRET: ci-placeholder-not-a-secret
      - run: npm audit --audit-level=high --omit=dev || true
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start app
        run: |
          npx next start --port 3100 &
          npx wait-on http://localhost:3100/api/health
      - run: npm run test:security
      - run: npx playwright test --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
